<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>밴드 합주 스케줄</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <h1>🎸 밴드 합주 시간표</h1>
      <div id="me-box" class="me-box">
        <span id="me-info" class="me-info"></span>
        <button id="edit-me-btn" class="btn btn-ghost">내 정보</button>
      </div>
    </header>

    <section class="legend">
      <span class="legend-title">세션</span>
      <span class="legend-item"><i class="dot" data-session="drum"></i>드럼</span>
      <span class="legend-item"><i class="dot" data-session="bass"></i>베이스</span>
      <span class="legend-item"><i class="dot" data-session="guitar"></i>일렉기타</span>
      <span class="legend-item"><i class="dot" data-session="vocal_f"></i>보컬(여)</span>
      <span class="legend-item"><i class="dot" data-session="vocal_m"></i>보컬(남)</span>
      <span class="legend-item full-band-legend"><i class="dot full-band-dot"></i>전 세션 합주 가능</span>
    </section>

    <section id="summary" class="summary">
      <h2>✨ 전 세션 합주 가능 시간</h2>
      <div id="summary-list" class="summary-list">
        <span class="muted">아직 데이터가 없습니다. 아래 표에서 가능한 시간을 클릭해 주세요.</span>
      </div>
    </section>

    <main class="main-layout">
      <div class="grid-wrapper">
        <table id="grid"></table>
        <p class="hint">칸을 클릭하면 <b>내</b> 가능 시간이 표시/해제됩니다. 칸 위에 마우스를 올리면 누가 가능한지 볼 수 있어요.</p>
      </div>

      <aside id="member-list" class="member-list">
        <h2>밴드원</h2>
        <div id="member-groups"></div>
      </aside>
    </main>
  </div>

  <div id="identity-modal" class="modal-backdrop hidden">
    <div class="modal">
      <h2>내 정보 입력</h2>
      <p class="muted">이름과 담당 세션을 선택해 주세요.</p>
      <label for="name-input">이름</label>
      <input id="name-input" type="text" maxlength="12" placeholder="예: 홍길동" />
      <label for="session-select">세션</label>
      <select id="session-select">
        <option value="drum">드럼</option>
        <option value="bass">베이스</option>
        <option value="guitar">일렉기타</option>
        <option value="vocal_f">보컬(여)</option>
        <option value="vocal_m">보컬(남)</option>
      </select>
      <div class="modal-actions">
        <button id="leave-btn" class="btn btn-danger hidden">밴드 나가기</button>
        <button id="save-me-btn" class="btn btn-primary">저장</button>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
